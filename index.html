<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residency Updates - Homepage</title>
    <script src="server/config.js"></script>
    <link rel="stylesheet" href="css/core/variables.css">
    <link rel="stylesheet" href="css/core/base.css">
    <link rel="stylesheet" href="css/core/layout.css">
    <link rel="stylesheet" href="css/core/navigation.css">
    <link rel="stylesheet" href="css/components/cards.css">
    <link rel="stylesheet" href="css/form.css">
    <link rel="stylesheet" href="css/updates.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="container">
            <div class="nav-brand">
                <span class="brand-title">Residency Updates</span>
            </div>
            <div class="nav-account">
                <div class="nav-links">
                    <a href="weekly-update.html" class="nav-link">New Update</a>
                    <a href="dashboard.html" class="nav-link">Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container">
            <div class="header">
                <h1><em>residency</em> progress</h1>
                <p>comprehensive summaries of our <em>builders</em> and their journey</p>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <section class="content-wrapper">
        <div class="container">
            <div id="homeLoading" class="simple-loading">
                <div class="spinner"></div>
                <p>Loading user summaries...</p>
            </div>

            <div id="homeError" class="error-message">
                <p>Failed to load summaries. Please try again.</p>
            </div>

            <div id="homeEmpty" class="empty-state">
                <h3>No Summaries Available</h3>
                <p>No user summaries have been generated yet.</p>
                <a href="weekly-update.html" class="btn btn-primary">Create First Update</a>
            </div>

            <div id="summariesContainer" class="summaries-container" style="display: none;">
                <!-- User summaries will be populated here -->
            </div>
        </div>
    </section>

    <script src="js/core/user-session.js"></script>
    <script src="js/pages/homepage.js"></script>
</body>
</html>
